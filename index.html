<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the app draw under the notch/Dynamic Island
         and home indicator when installed to the home screen (standalone
         display mode) — a no-op in a normal browser tab, which has no
         safe-area insets to speak of. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Evertill</title>
    <meta
      name="description"
      content="Evertill is two apps under one login: Tasks + Notes for everyday work, and a Leads, Pipeline, and Deals CRM for the relationships and transactions you're closing."
    />
    <meta property="og:title" content="Evertill" />
    <meta
      property="og:description"
      content="Two apps, one login — Tasks + Notes for everyday work, and a Leads, Pipeline, and Deals CRM for relationships and transactions."
    />
    <meta property="og:type" content="website" />

    <!-- PWA: vite-plugin-pwa injects the <link rel="manifest"> and service
         worker registration automatically from vite.config.ts's manifest
         option — these are the pieces it doesn't cover, iOS Safari's own
         older, non-manifest-spec way of configuring "Add to Home Screen".
         apple-mobile-web-app-status-bar-style is "black-translucent" (web
         content draws full-bleed under a transparent status bar) rather
         than "default" (an opaque native status bar area, content starts
         below it) — "default" turned out to make iOS miscalculate 100dvh
         in standalone/home-screen mode by roughly the status bar's own
         height, pushing BottomTabBar.tsx's fixed bottom bar that far below
         the real visible area (only a normal Safari tab was fine — Safari
         ignores viewport-fit=cover there entirely, so this bug only ever
         showed up once actually launched from the home screen).
         black-translucent avoids relying on that iOS auto-reservation
         at all; TopNav.tsx/Header.tsx now pad for the status bar
         themselves via env(safe-area-inset-top), the same explicit,
         well-tested pattern BottomTabBar.tsx already uses for the bottom
         safe area. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Evertill" />
    <!-- Used by the landing page only (src/components/LandingPage.tsx) — the
         rest of the app intentionally keeps its existing system-font stack,
         so this doesn't touch any already-verified in-app UI. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
